; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs =
    nodemcuv2
    esp32c3supermini
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = https://github.com/cwi-dis/iotsa.git#develop
build_flags =

; iotsa_v4 (ESP8266 nodemcuv2). 4m1m: 1MB filesystem + OTA scratch space -- this
; app has IotsaOtaMod, so it cannot use the 4m3m (no-OTA) layout.
[env:nodemcuv2]
extends = iotsa_v4
board_build.ldscript = eagle.flash.4m1m.ld

; First-class ESP32 target: an ESP32-C3 SuperMini is the natural "next breadboard
; buddy" build of this device (USB-C, cheap, small, more usable GPIO than the
; ESP-12). Native USB-CDC serial, so the _esp32c3_nativeusb flags apply.
[env:esp32c3supermini]
extends = esp32c3supermini
build_flags = ${_esp32c3_nativeusb.build_flags}
